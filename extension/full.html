<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC Crash History</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width:860px) { .cols { grid-template-columns:1fr; } }
  .latest { display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  .latest code { flex:1; min-width:260px; }
  #progress { color:var(--muted); font-size:12px; }
  table.t { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  table.t th, table.t td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.t th { color:var(--muted); font-weight:500; font-size:11px; position:sticky; top:0; background:var(--panel); }
  table.t td.h { font:11px ui-monospace, Consolas, monospace; color:var(--muted); }
  table.t td.x { font-weight:700; }
  table.t tr.sel td { background:#1f2533; }
  .tablewrap { overflow-x:auto; }
  .pager { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0; color:var(--muted); }
  .pager input { width:110px; }
  #strip { display:flex; gap:1px; align-items:flex-end; height:80px; margin-top:10px; }
  #strip div { flex:1; min-width:1px; border-radius:1px 1px 0 0; }
</style>
</head>
<body>
<main>
  <h1>BC Crash History <span id="progress"></span></h1>

  <section class="card" id="emptyCard" hidden>
    No round saved yet. Open <b>bc.game/game/crash</b>, click the extension icon, then <b>Get latest round</b>.
  </section>

  <section class="card" id="latestCard" hidden>
    <div class="latest">
      <div class="round">Latest round <b id="roundId"></b></div>
      <div class="crash" id="crash"></div>
      <code id="hash"></code>
    </div>
    <div id="strip" title="Last 300 rounds, oldest on the left. Red below 2×, green 2× and up, gold 10× and up."></div>
  </section>

  <div class="cols" id="cols" hidden>
    <section class="card">
      <h2>Analysis</h2>
      <div id="analysis"></div>
    </section>
    <section class="card">
      <h2>All payout points <span class="muted" id="ovTitle"></span></h2>
      <table class="t">
        <thead><tr><th>Payout</th><th>Below</th><th>At or above</th><th>Max combo below</th><th>Max combo above</th></tr></thead>
        <tbody id="overview"></tbody>
      </table>
    </section>
  </div>

  <section class="card" id="historyCard" hidden>
    <h2>Rounds <span class="muted">(newest first)</span></h2>
    <div class="pager">
      <button id="first">« Newest</button>
      <button id="prev">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="next">Next ›</button>
      <button id="last">Oldest »</button>
      <span style="margin-left:auto">Find round</span>
      <input id="find" inputmode="numeric" placeholder="Round ID">
      <button id="csv">Download CSV</button>
    </div>
    <div class="tablewrap">
      <table class="t">
        <thead><tr><th>#</th><th>Round</th><th>Crash</th><th>Hash</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="full.js"></script>
</body>
</html>
