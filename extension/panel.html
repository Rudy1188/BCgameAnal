<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC Crash Trend</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow-x:hidden; }
  main { padding:8px; }
  .card { padding:8px; margin-bottom:8px; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .bar .round { flex:1; }
  .bar .round b { font-size:14px; }
  .bar .crash { font-size:18px; }
  .tools { display:flex; gap:10px; align-items:center; }
  .live { font-size:11px; color:var(--muted); }
  .live.on { color:var(--high); }
  #autoStatus { margin:0 0 6px; }

  .gear { all:unset; cursor:pointer; color:var(--muted); display:flex; padding:2px; border-radius:4px; }
  .gear:hover, .gear.on { color:var(--text); background:#252a35; }
  .set-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .set-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
  .set-grid label { display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--muted); }
  .set-grid label > span { display:flex; align-items:center; gap:6px; }
  .set-grid input[type=number] { width:64px; font:12px system-ui, sans-serif; padding:3px 6px; }
  .set-grid input[type=range] { width:90px; accent-color:var(--accent); }
  .set-grid output { width:34px; text-align:right; color:var(--text); font-size:11px; }
  .set-colors { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:8px; }
  .set-colors label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; }
  .set-colors input { width:26px; height:20px; padding:0; border:1px solid var(--line); border-radius:4px; background:none; cursor:pointer; }
  .trend-card { background:var(--layer); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:11px; margin-bottom:6px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; }

  .an-head { display:flex; gap:5px; align-items:center; flex-wrap:wrap; color:var(--muted); }
  .an-head input { width:84px; font:13px system-ui, sans-serif; padding:4px 6px; }
  .an-head input.pt { width:62px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .chips button { font-size:11px; padding:2px 8px; }
  .chips button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chips .sep { width:1px; background:var(--line); margin:0 3px; }
  table.an { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:6px; }
  table.an th, table.an td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  table.an th { color:var(--muted); font-weight:500; font-size:11px; }
  table.an td:first-child { font-weight:700; }
  .note { color:var(--muted); font-size:11px; margin-top:4px; }
  .note:empty { display:none; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="round" id="roundLine"><span class="empty">No round yet. Click <b>Refresh</b>.</span></div>
    <div class="tools">
      <span class="live" id="live"></span>
      <button class="link" id="refresh" title="Read the newest round from this page">Refresh</button>
      <button class="gear" id="gear" title="Trend settings"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    </div>
  </div>
  <div class="status" id="autoStatus"></div>

  <section class="card settings" id="settings" hidden>
    <div class="set-head"><b>Trend settings</b><button class="link" id="setDefault">Default</button></div>
    <div class="set-grid">
      <label>Rows <input type="number" id="sRows" min="4" max="20" step="1"></label>
      <label>Columns <input type="number" id="sCols" min="10" max="60" step="1"></label>
      <label>Cell size <span><input type="range" id="sCell" min="10" max="30" step="1"><output id="oCell"></output></span></label>
      <label>Ball size <span><input type="range" id="sDot" min="30" max="100" step="5"><output id="oDot"></output></span></label>
    </div>
    <div class="set-colors">
      <label><input type="color" id="cBust"> 1.00×</label>
      <label><input type="color" id="cLow"> below 2×</label>
      <label><input type="color" id="cHigh"> 2× and up</label>
      <label><input type="color" id="cBig"> 10× and up</label>
      <label><input type="color" id="cCell"> cell</label>
      <label><input type="color" id="cLayer"> background</label>
    </div>
  </section>

  <div id="main" hidden>
    <section class="card trend-card">
      <div class="legend">
        <span><i style="background:var(--bust)"></i>1.00×</span>
        <span><i style="background:var(--low)"></i>below 2×</span>
        <span><i style="background:var(--high)"></i>2× and up</span>
        <span><i style="background:var(--big)"></i>10× and up</span>
      </div>
      <div id="trend"></div>
    </section>

    <section class="card">
      <div class="an-head">
        <span>Last</span>
        <input id="count" type="number" min="10" max="100000" step="1" title="10 to 100,000 rounds">
        <span>issue, payout &lt;</span>
        <input id="point" class="pt" type="number" min="1.01" step="0.01">
      </div>
      <div class="chips" id="chips"></div>
      <table class="an">
        <thead><tr><th>Range</th><th>Chance</th><th>Count</th><th>Max Combo</th></tr></thead>
        <tbody id="anBody"></tbody>
      </table>
      <div class="note" id="note"></div>
    </section>
  </div>

</main>
<script type="module" src="panel.js"></script>
</body>
</html>
