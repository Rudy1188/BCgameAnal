<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC Crash Trend</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-width:320px; }
  main { padding:10px; }
  .card { padding:10px; margin-bottom:8px; }
  h1 { margin-bottom:6px; }
  h1 .tools { display:flex; gap:10px; align-items:center; }
  #autoStatus { margin:0 0 8px; }
  .live { font-size:11px; font-weight:500; color:var(--muted); }
  .live.on { color:var(--high); }

  .top .crash { font-size:24px; }
  details.hashes { margin-top:6px; }

  .an-head { display:flex; gap:5px; align-items:center; flex-wrap:wrap; color:var(--muted); }
  .an-head input { width:84px; font:13px system-ui, sans-serif; padding:4px 6px; }
  .an-head input.pt { width:62px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .chips button { font-size:11px; padding:2px 8px; }
  .chips button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chips .sep { width:1px; background:var(--line); margin:0 3px; }
  table.an { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:8px; }
  table.an th, table.an td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
  table.an th { color:var(--muted); font-weight:500; font-size:11px; }
  table.an td:first-child { font-weight:700; }
  .note { color:var(--muted); font-size:11px; margin-top:4px; }
  .note:empty { display:none; }

  .legend { display:flex; gap:12px; justify-content:center; color:var(--muted); font-size:11px; margin-bottom:6px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; }

  .best { display:flex; align-items:center; gap:12px; padding:10px; border-radius:8px; cursor:pointer;
          background:linear-gradient(135deg, #3a2f10, #1d1a12); border:1px solid #6b5520; }
  .best .x { font-size:28px; font-weight:800; color:var(--big); font-variant-numeric:tabular-nums; line-height:1.1; }
  .best .meta { color:var(--muted); font-size:11px; }
  .best .meta b { color:var(--text); font-size:13px; }
  .tops { margin-top:8px; display:grid; gap:3px; }
  .tops .r { display:grid; grid-template-columns:18px 64px 1fr auto; gap:6px; align-items:center; font-size:12px;
             font-variant-numeric:tabular-nums; cursor:pointer; padding:1px 2px; border-radius:4px; }
  .tops .r:hover { background:#252a35; }
  .tops .n { color:var(--muted); text-align:right; }
  .tops .id { color:var(--muted); }
  .tops .bar { height:8px; border-radius:4px; background:var(--big); min-width:3px; }
  .tops .v { text-align:right; font-weight:700; }

  .hist { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-top:6px; }
  .hist div { display:flex; justify-content:space-between; gap:4px; background:var(--bg); border-radius:4px; padding:3px 6px;
              font-size:12px; font-variant-numeric:tabular-nums; }
  .hist .id { color:var(--muted); font-size:11px; }
  .hist b { font-weight:700; }
  .pager { display:flex; justify-content:center; align-items:center; gap:4px; margin-top:6px; color:var(--muted); font-size:12px; }
  .pager button { min-width:30px; padding:3px 0; }
  .pager button:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>BC Crash Trend
    <span class="tools">
      <span class="live" id="live"></span>
      <button class="link" id="refresh" title="Read the newest round from the bc.game tab">Refresh</button>
      <button class="link" id="reset" title="Forget the saved round">Reset</button>
    </span>
  </h1>
  <div class="status" id="autoStatus"></div>

  <section class="card">
    <div id="empty" class="empty">No round yet. Open <b>bc.game/game/crash</b>, then click <b>Refresh</b>.</div>
    <div id="latest" hidden>
      <div class="top">
        <div class="round">Round <b id="roundId"></b></div>
        <div class="crash" id="crash"></div>
      </div>
      <details class="hashes">
        <summary>Hash &amp; salt</summary>
        <div class="field"><span>Hash <button class="link" data-copy="hash">Copy</button></span><code id="hash"></code></div>
        <div class="field"><span>Salt <button class="link" data-copy="salt">Copy</button></span><code id="salt"></code></div>
        <div class="status" id="status"></div>
      </details>
    </div>
  </section>

  <div id="main" hidden>
    <section class="card">
      <div class="an-head">
        <span>Last</span>
        <input id="count" type="number" min="10" max="100000" step="1" title="10 to 100,000 rounds">
        <span>issue, payout &lt;</span>
        <input id="point" class="pt" type="number" min="1.01" step="0.01">
      </div>
      <div class="chips" id="chips"></div>
      <table class="an">
        <thead><tr><th>Range</th><th>Chance</th><th>Count</th><th>Max Combo</th></tr></thead>
        <tbody id="anBody"></tbody>
      </table>
      <div class="note" id="note"></div>
    </section>

    <section class="card">
      <h2>Trend</h2>
      <div class="legend">
        <span><i style="background:var(--low)"></i>below <span class="pt-label"></span></span>
        <span><i style="background:var(--high)"></i><span class="pt-label"></span> and up</span>
        <span><i style="background:var(--big)"></i>10× and up</span>
      </div>
      <div id="trend"></div>
    </section>

    <section class="card">
      <h2>Biggest crash <span class="muted" id="bigRange"></span></h2>
      <div id="best"></div>
      <div class="tops" id="tops"></div>
    </section>

    <section class="card">
      <h2>History</h2>
      <div class="hist" id="hist"></div>
      <div class="pager" id="histPager">
        <button data-h="first" title="Newest">«</button>
        <button data-h="prev" title="Newer">‹</button>
        <span id="histPage"></span>
        <button data-h="next" title="Older">›</button>
        <button data-h="last" title="Oldest">»</button>
      </div>
    </section>
  </div>

  <details class="card">
    <summary>Enter a round by hand</summary>
    <div class="row"><input id="mRound" placeholder="Round ID, e.g. 9745447" inputmode="numeric"></div>
    <div class="row"><input id="mHash" placeholder="Hash (64 hex characters)" spellcheck="false"></div>
    <div class="row"><input id="mSalt" placeholder="Salt (leave empty for default)" spellcheck="false"><button id="mSave">Save</button></div>
    <div class="status" id="mError"></div>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
