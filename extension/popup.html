<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BC Crash Hash</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e8ee; --muted:#8a91a3;
          --low:#ff6b6b; --high:#4fd18b; --big:#f5c451; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; width:460px; font:13px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .round { color:var(--muted); }
  .round b { color:var(--text); font-size:16px; }
  .crash { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .field { margin-top:8px; }
  .field span { color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }
  code { display:block; font:11px ui-monospace, Consolas, monospace; word-break:break-all; color:var(--text); margin-top:2px; }
  .status { margin-top:8px; font-size:11px; color:var(--muted); }
  .ok { color:var(--high); } .warn { color:var(--big); }
  .lo { color:var(--low); } .hi { color:var(--high); } .bg { color:var(--big); }
  button { font:inherit; color:var(--text); background:#252a35; border:1px solid var(--line); border-radius:5px; padding:3px 9px; cursor:pointer; }
  button:hover { background:#2f3542; }
  button.link { background:none; border:0; color:var(--accent); padding:0; font-size:11px; }
  input { font:12px ui-monospace, Consolas, monospace; color:var(--text); background:var(--bg); border:1px solid var(--line);
          border-radius:5px; padding:5px 7px; width:100%; }
  .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:8px 0; }
  .stat { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
  .stat b { display:block; font-size:14px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:10px; }
  .tablewrap { max-height:260px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:11px; position:sticky; top:0; background:var(--panel); }
  td.h { font:10px ui-monospace, Consolas, monospace; color:var(--muted); }
  td.x { font-weight:700; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>BC Crash Hash <button class="link" id="reset" title="Forget the saved round">Reset</button></h1>

  <section class="card" id="latestCard">
    <div id="empty" class="empty">
      No round yet. Open <b>bc.game/game/crash</b> and click the latest round in the history once, so its
      Round ID / Salt / Hash box shows. After that, new rounds are picked up automatically.
    </div>
    <div id="latest" hidden>
      <div class="top">
        <div class="round">Round <b id="roundId"></b></div>
        <div class="crash" id="crash"></div>
      </div>
      <div class="field"><span>Hash <button class="link" data-copy="hash">Copy</button></span><code id="hash"></code></div>
      <div class="field"><span>Salt <button class="link" data-copy="salt">Copy</button></span><code id="salt"></code></div>
      <div class="status" id="status"></div>
    </div>
  </section>

  <section class="card" id="historyCard" hidden>
    <div class="row" style="margin-top:0">
      <span style="color:var(--muted)">Earlier rounds</span>
      <input id="count" type="number" min="1" max="5000" value="100" style="width:80px; margin-left:auto">
      <button id="calc">Calculate</button>
      <button id="csv">CSV</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Round</th><th>Crash</th><th>Hash</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <details class="card">
    <summary>Enter a round by hand</summary>
    <div class="row"><input id="mRound" placeholder="Round ID, e.g. 9745447" inputmode="numeric"></div>
    <div class="row"><input id="mHash" placeholder="Hash (64 hex characters)" spellcheck="false"></div>
    <div class="row"><input id="mSalt" placeholder="Salt (leave empty for default)" spellcheck="false"><button id="mSave">Save</button></div>
    <div class="status" id="mError"></div>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
