<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BC Crash Hash</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width:520px; }
  #autoStatus { margin:0 0 10px; }
</style>
</head>
<body>
<main>
  <h1>BC Crash Hash <button class="link" id="reset" title="Forget the saved round">Reset</button></h1>
  <div class="status" id="autoStatus"></div>

  <section class="card">
    <div id="empty" class="empty">No round yet. Open <b>bc.game/game/crash</b>, then open this popup again.</div>
    <div id="latest" hidden>
      <div class="top">
        <div class="round">Round <b id="roundId"></b></div>
        <div class="crash" id="crash"></div>
      </div>
      <div class="field"><span>Hash <button class="link" data-copy="hash">Copy</button></span><code id="hash"></code></div>
      <div class="field"><span>Salt <button class="link" data-copy="salt">Copy</button></span><code id="salt"></code></div>
      <div class="status" id="status"></div>
    </div>
  </section>

  <section class="card" id="trendCard" hidden>
    <h2>Trend</h2>
    <div id="trend"></div>
  </section>

  <section class="card" id="analysisCard" hidden>
    <h2>Analysis</h2>
    <div id="analysis"></div>
    <button class="primary secondary" id="openFull" style="margin-top:10px">Open full history (up to 5,000,000 rounds)</button>
    <button class="primary secondary" id="openReport" style="margin-top:6px">Score per point (1.01×–10×, 1,000,000 rounds)</button>
  </section>

  <details class="card">
    <summary>Enter a round by hand</summary>
    <div class="row"><input id="mRound" placeholder="Round ID, e.g. 9745447" inputmode="numeric"></div>
    <div class="row"><input id="mHash" placeholder="Hash (64 hex characters)" spellcheck="false"></div>
    <div class="row"><input id="mSalt" placeholder="Salt (leave empty for default)" spellcheck="false"><button id="mSave">Save</button></div>
    <div class="status" id="mError"></div>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
